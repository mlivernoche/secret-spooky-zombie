name: Dev container image

on:
  push:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install multi-platform image publisher
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dev Container builder includes Features and their runtime metadata.
      # A plain Docker build would omit Docker-in-Docker, Codex, and editor settings.
      - name: Build and publish dev container
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/prebuild/devcontainer.json
          imageName: ${{ steps.image.outputs.name }}
          imageTag: latest,sha-${{ github.sha }}
          platform: linux/amd64,linux/arm64
          cacheFrom: ${{ steps.image.outputs.name }}:latest
          noCache: ${{ github.event_name == 'schedule' }}
          push: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
